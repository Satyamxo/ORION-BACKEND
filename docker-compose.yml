version: "3.8"

services:

  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db

  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    depends_on:
      - mongo

  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    depends_on:
      - mongo

  messaging-service:
    build: ./messaging-service
    env_file:
      - ./messaging-service/.env
    depends_on:
      - mongo

  events-service:
    build: ./events-service
    env_file:
      - ./events-service/.env
    depends_on:
      - mongo

  media-service:
    build: ./media-service
    env_file:
      - ./media-service/.env
    depends_on:
      - mongo

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth-service
      - user-service
      - messaging-service
      - events-service
      - media-service

volumes:
  mongo_data: